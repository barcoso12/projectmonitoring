services:
  # Backend Service
  - type: web
    name: project-monitoring-backend
    env: node
    rootDir: projectmonitoring/backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: project-monitoring-db
          property: connectionString

  # Frontend Service (Static Site)
  - type: static
    name: project-monitoring-frontend
    env: static
    rootDir: projectmonitoring/frontend
    buildCommand: npm install && npm run build
    publishDir: dist
